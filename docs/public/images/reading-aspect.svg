<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">同一件事：观察它的不同时间与状态</title><desc id="desc">不要把每种动词形式都机械对应一个中文时间词。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#20324b}.t{font-size:29px;font-weight:750}.s{font-size:17px;fill:#61738c}.h{font-size:23px;font-weight:700}.v{font-size:24px;font-weight:650}.d{font-size:18px;fill:#526783}.tiny{font-size:16px;fill:#586b82}.stroke{stroke:#799cc2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f8fafd"/><text x="52" y="65" class="t">同一件事：观察它的不同时间与状态</text><text x="52" y="99" class="s">不要把每种动词形式都机械对应一个中文时间词。</text><rect x="55" y="155" width="350" height="192" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><text x="83" y="204" class="h">reads every night</text><text x="83" y="253" class="v">习惯 / 反复发生</text><text x="83" y="310" class="d">She reads every night.</text><rect x="425" y="155" width="350" height="192" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="453" y="204" class="h">is reading now</text><text x="453" y="253" class="v">正在进行的过程</text><text x="453" y="310" class="d">She is reading now.</text><rect x="795" y="155" width="350" height="192" rx="16" fill="#fff1da" stroke="#e0c194" stroke-width="2"/><text x="823" y="204" class="h">has read the book</text><text x="823" y="253" class="d">过去事件与现在的关联</text><text x="823" y="310" class="d">She has read the book.</text><text x="55" y="410" class="s">具体是“读过”还是“读完”，要连同词语搭配与上下文判断。</text></svg>