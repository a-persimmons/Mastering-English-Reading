<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>that 从句：修饰名词，还是解释名词内容？</title><desc>两句只换了从句谓语，分析方法却不同。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#203651}.h{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#66798c}.label{font-size:22px;font-weight:bold}.ex{font-size:22px}.detail{font-size:18px;fill:#526b80}.wire{fill:none;stroke:#7b9cbc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="62" class="h">that 从句：修饰名词，还是解释名词内容？</text><text x="45" y="95" class="sub">两句只换了从句谓语，分析方法却不同。</text><rect x="54" y="145" width="524" height="235" rx="16" fill="#e3efff" stroke="#94b5dc" stroke-width="2"/><text x="78" y="191" class="label">同位语从句：说明消息内容</text><text x="78" y="238" class="ex">The news that he had won ...</text><text x="78" y="285" class="detail">he had won（从句内部完整）</text><text x="78" y="333" class="detail">说明 news 说的是什么</text><rect x="622" y="145" width="524" height="235" rx="16" fill="#e2f5ed" stroke="#97cdb6" stroke-width="2"/><text x="647" y="191" class="label">定语从句：限定哪条消息</text><text x="647" y="238" class="ex">The news that he reported ...</text><text x="647" y="285" class="detail">he reported [the news]</text><text x="647" y="333" class="detail">reported 后有宾语空位</text><text x="60" y="429" class="sub">不是检查 that 前面有没有名词，而是检查从句结构和两者的语义关系。</text></svg>