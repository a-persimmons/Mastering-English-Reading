<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"><title>同一个需求，选择不同的请求方式</title><desc>不是越长越礼貌，而是要看关系、紧急程度与沟通目的。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253550}.title{font-size:28px;font-weight:750}.subtitle{font-size:17px;fill:#60748e}.h{font-size:22px;font-weight:700}.d{font-size:19px;fill:#536880}.v{font-size:23px}.path{fill:none;stroke:#81a0bf;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="24" fill="#f7f9fd"/><text x="50" y="62" class="title">同一个需求，选择不同的请求方式</text><text x="50" y="96" class="subtitle">不是越长越礼貌，而是要看关系、紧急程度与沟通目的。</text><rect x="50" y="145" rx="16" width="522" height="234" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="75" y="193" class="h">日常礼貌请求</text><text x="75" y="244" class="v">Could you close the window?</text><text x="75" y="296" class="d">给对方选择空间</text><rect x="628" y="145" rx="16" width="522" height="234" fill="#e0f4eb" stroke="#95cbb2" stroke-width="2"/><text x="650" y="193" class="h">紧急情况下直接行动</text><text x="650" y="244" class="v">Get out!</text><text x="650" y="296" class="d">确保对方立即理解</text><text x="57" y="428" class="subtitle">人际关系、现场安全和交流意图，比“礼貌句式排行榜”更重要。</text></svg>