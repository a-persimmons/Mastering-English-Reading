<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="英语句子学习结构图"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#14233e}.ttl{font-size:29px;font-weight:750}.sub{font-size:18px;fill:#59708e}.t{font-size:22px;font-weight:600}.small{font-size:17px;fill:#526781}.blue{fill:#dceaff;stroke:#6a9bda;stroke-width:2}.warm{fill:#fff1d7;stroke:#deb26c;stroke-width:2}.mint{fill:#def5ee;stroke:#71bb9d;stroke-width:2}.wire{stroke:#7990ad;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="25" fill="#f7f9fd"/><text x="55" y="60" class="ttl">自然意译的底线：表达可以变，原意不能变</text><rect x="52" y="125" width="340" height="106" rx="17" class="blue"/><text x="74" y="186" class="t">事实：谁 / 做什么</text><rect x="438" y="125" width="340" height="106" rx="17" class="warm"/><text x="460" y="186" class="t">修饰：何时 / 对谁</text><rect x="824" y="125" width="340" height="106" rx="17" class="blue"/><text x="846" y="186" class="t">逻辑：因果 / 让步</text><rect x="52" y="295" width="340" height="106" rx="17" class="warm"/><text x="74" y="356" class="t">语气：可能 / 肯定</text><rect x="438" y="295" width="340" height="106" rx="17" class="blue"/><text x="460" y="356" class="t">边界：不能添加情节</text><text x="85" y="523" class="sub">对照原文逐项核查 → 再判断中文是否通顺</text></svg>