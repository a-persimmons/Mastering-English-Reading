<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" role="img" aria-labelledby="title desc"><title id="title">相同介词短语：它可能连到不同位置</title><desc id="desc">under the tree 的含义与附着对象都需要看整句。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#20324b}.t{font-size:29px;font-weight:750}.s{font-size:17px;fill:#61738c}.h{font-size:23px;font-weight:700}.v{font-size:24px;font-weight:650}.d{font-size:18px;fill:#526783}.tiny{font-size:16px;fill:#586b82}.stroke{stroke:#799cc2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="468" rx="24" fill="#f8fafd"/><text x="52" y="65" class="t">相同介词短语：它可能连到不同位置</text><text x="52" y="99" class="s">under the tree 的含义与附着对象都需要看整句。</text><rect x="50" y="144" width="528" height="246" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><rect x="622" y="144" width="528" height="246" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="80" y="191" class="h">修饰名词：哪个男孩？</text><text x="80" y="239" class="v">The boy under the tree ...</text><text x="80" y="285" class="d">under the tree → boy</text><text x="80" y="330" class="d">树下的那个男孩</text><text x="652" y="191" class="h">修饰活动：在哪里读书？</text><text x="652" y="239" class="v">The boy is reading under the tree.</text><text x="652" y="285" class="d">under the tree → reading</text><text x="652" y="330" class="d">男孩在树下读书</text><text x="55" y="434" class="s">不能“看到介词短语就统一标成地点状语”。</text></svg>