<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>词块不只是死记整句：很多表达带有可替换位置</title><desc>把场景联系到一个模式，再替换人物、话题、动作。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253652}.big{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#657993}.hd{font-size:23px;font-weight:700}.text{font-size:21px}.info{font-size:18px;fill:#536982}.line{stroke:#839ebf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f7f9fc"/><text x="51" y="63" class="big">词块不只是死记整句：很多表达带有可替换位置</text><text x="51" y="97" class="sub">把场景联系到一个模式，再替换人物、话题、动作。</text><rect x="51" y="145" width="1097" height="115" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="89" y="192" class="hd">I'm interested in [话题 / 活动]</text><text x="90" y="232" class="info">I'm interested in music.     I'm interested in learning English.</text><path class="line" d="M586 263 V301"/><rect x="96" y="307" width="310" height="100" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="118" y="344" class="hd">看懂一个词块</text><text x="118" y="377" class="info">认识意义与搭配</text><rect x="449" y="307" width="310" height="100" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="472" y="344" class="hd">主动替换槽位</text><text x="472" y="377" class="info">换主语 / 换话题</text><rect x="801" y="307" width="310" height="100" rx="17" fill="#fff1d8" stroke="#ddbc83" stroke-width="2"/><text x="824" y="344" class="hd">检查用法边界</text><text x="824" y="377" class="info">例如 interested ≠ interesting</text><text x="53" y="447" class="sub">不只抄一百句：能在新情境里准确调用，才算向前迈了一步。</text></svg>