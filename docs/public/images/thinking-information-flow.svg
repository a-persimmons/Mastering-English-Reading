<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 370" role="img" aria-label="段落理解：已知话题与新信息的推进"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#203453}.title{font-weight:700;font-size:28px}.label{font-weight:650;font-size:21px}.small{font-size:17px;fill:#52657c}.line{fill:none;stroke:#6f9bc9;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:#e7f0ff;stroke:#82a6d2;stroke-width:2}.b{fill:#e1f4ed;stroke:#7dbca1;stroke-width:2}.c{fill:#fff2dc;stroke:#d7b276;stroke-width:2}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="58" class="title">段落理解：已知话题与新信息的推进</text><rect x="46" y="116" width="340" height="118" rx="17" class="a"/><text x="64" y="158" class="label">A book / 一本书</text><text x="64" y="189" class="small">首次引入新话题</text><path class="line" d="M391 171 L423 171"/><path class="line" d="M414 164 L423 171 L414 178"/><rect x="431" y="116" width="325" height="118" rx="17" class="b"/><text x="449" y="158" class="label">The book / 这本书</text><text x="449" y="189" class="small">对同一事物继续说明</text><path class="line" d="M763 171 L795 171"/><path class="line" d="M786 164 L795 171 L786 178"/><rect x="806" y="116" width="323" height="118" rx="17" class="c"/><text x="824" y="158" class="label">It / 它</text><text x="824" y="189" class="small">结合上文识别指代</text><text x="55" y="303" class="small">从单词之间的关系 → 到句子之间的话题延续 → 再把整段的中心意思复述出来</text></svg>