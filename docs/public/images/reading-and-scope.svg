<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>and 的三个连接层级</title><desc>连接词两端分别是词、谓语还是独立分句？</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#203651}.h{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#66798c}.label{font-size:22px;font-weight:bold}.ex{font-size:22px}.detail{font-size:18px;fill:#526b80}.wire{fill:none;stroke:#7b9cbc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="62" class="h">and 的三个连接层级</text><text x="45" y="95" class="sub">连接词两端分别是词、谓语还是独立分句？</text><rect x="45" y="145" width="354" height="219" rx="16" fill="#e3efff" stroke="#94b5dc" stroke-width="2"/><text x="64" y="190" class="label">并列名词</text><text x="64" y="238" class="ex">apples and oranges</text><text x="64" y="300" class="detail">仍在一个宾语位置</text><rect x="423" y="145" width="354" height="219" rx="16" fill="#e2f5ed" stroke="#97cdb6" stroke-width="2"/><text x="442" y="190" class="label">并列谓语</text><text x="442" y="238" class="ex">She opened ... and left.</text><text x="442" y="300" class="detail">共享同一主语 She</text><rect x="801" y="145" width="354" height="219" rx="16" fill="#fff1dc" stroke="#e4bd85" stroke-width="2"/><text x="820" y="190" class="label">并列分句</text><text x="820" y="238" class="ex">She left, and I stayed.</text><text x="820" y="300" class="detail">各自有完整主谓</text><text x="54" y="419" class="sub">是否有两个独立分句，不能只数 and 的数量。</text></svg>