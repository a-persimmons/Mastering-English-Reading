<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>是“我感觉到”，还是“它让人产生这种感受”？</title><desc>-ed 和 -ing 在这一组情绪形容词里承担不同语义角色。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253652}.big{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#657993}.hd{font-size:23px;font-weight:700}.text{font-size:21px}.info{font-size:18px;fill:#536982}.line{stroke:#839ebf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f7f9fc"/><text x="51" y="63" class="big">是“我感觉到”，还是“它让人产生这种感受”？</text><text x="51" y="97" class="sub">-ed 和 -ing 在这一组情绪形容词里承担不同语义角色。</text><rect x="48" y="145" width="529" height="234" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="76" y="192" class="hd">表达人的感受</text><text x="76" y="248" class="text">I'm bored.</text><text x="76" y="298" class="info">描述我的状态</text><text x="76" y="340" class="info">我觉得无聊</text><rect x="623" y="145" width="529" height="234" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="650" y="192" class="hd">描述事物的特点</text><text x="650" y="248" class="text">The movie is boring.</text><text x="650" y="298" class="info">描述电影引发的感受</text><text x="650" y="340" class="info">这部电影很无聊</text><text x="60" y="429" class="sub">同理：interested / interesting，excited / exciting，disappointed / disappointing。</text></svg>