<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="英语句子学习结构图"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#14233e}.ttl{font-size:29px;font-weight:750}.sub{font-size:18px;fill:#59708e}.t{font-size:22px;font-weight:600}.small{font-size:17px;fill:#526781}.blue{fill:#dceaff;stroke:#6a9bda;stroke-width:2}.warm{fill:#fff1d7;stroke:#deb26c;stroke-width:2}.mint{fill:#def5ee;stroke:#71bb9d;stroke-width:2}.wire{stroke:#7990ad;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="25" fill="#f7f9fd"/><text x="52" y="70" class="ttl">五种主干，承载不断增加的信息</text><text x="52" y="104" class="sub">五种句型是“骨架”；短语与从句可以附加其上</text><rect x="52" y="145" width="515" height="58" rx="13" class="blue"/><text x="77" y="183" class="t">SV · Birds fly.</text><rect x="52" y="221" width="515" height="58" rx="13" class="mint"/><text x="77" y="259" class="t">SVC · She seems happy.</text><rect x="52" y="297" width="515" height="58" rx="13" class="blue"/><text x="77" y="335" class="t">SVO · I like music.</text><rect x="52" y="373" width="515" height="58" rx="13" class="mint"/><text x="77" y="411" class="t">SVOO · He gave me a book.</text><rect x="52" y="449" width="515" height="58" rx="13" class="blue"/><text x="77" y="487" class="t">SVOC · They made me happy.</text><path class="wire" d="M585 347 H650 V260 H696"/><polygon points="705,260 692,252 692,268" fill="#7990ad"/><rect x="713" y="177" width="418" height="179" rx="18" class="warm"/><text x="748" y="224" class="t">+ 修饰信息</text><text x="748" y="259" class="small">形容词 · 介词短语 · 分词</text><text x="748" y="294" class="t">+ 分句层级</text><text x="748" y="330" class="small">定语 / 名词性 / 状语从句</text><text x="715" y="443" class="sub">→ 最终用“结构 + 语境”理解整句</text></svg>