<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>同一实物：说“总体量”还是“具体件数”？</title><desc>furniture、advice、coffee 的表达方式需要看说话人如何计量。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253652}.big{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#657993}.hd{font-size:23px;font-weight:700}.text{font-size:21px}.info{font-size:18px;fill:#536982}.line{stroke:#839ebf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f7f9fc"/><text x="51" y="63" class="big">同一实物：说“总体量”还是“具体件数”？</text><text x="51" y="97" class="sub">furniture、advice、coffee 的表达方式需要看说话人如何计量。</text><rect x="44" y="147" width="348" height="227" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="70" y="190" class="hd">集合概念</text><text x="70" y="246" class="text">some furniture</text><text x="70" y="296" class="info">谈整体，不直接加 -s</text><rect x="425" y="147" width="348" height="227" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="451" y="190" class="hd">计数单位</text><text x="451" y="246" class="text">three pieces of furniture</text><text x="451" y="296" class="info">通过 piece 明确件数</text><rect x="806" y="147" width="348" height="227" rx="17" fill="#fff1d8" stroke="#ddbc83" stroke-width="2"/><text x="832" y="190" class="hd">情境中的份数</text><text x="832" y="246" class="text">two coffees, please</text><text x="832" y="296" class="info">点单时两杯咖啡</text><text x="51" y="420" class="sub">注意：可数性来自词义与使用场景，不是由中文量词直接推导。</text></svg>