<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"><title>听力不是“听到每个字母”，而是三层实时加工</title><desc>看得懂文字，不代表已能从连续语流中听出词块。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253550}.title{font-size:28px;font-weight:750}.subtitle{font-size:17px;fill:#60748e}.h{font-size:22px;font-weight:700}.d{font-size:19px;fill:#536880}.v{font-size:23px}.path{fill:none;stroke:#81a0bf;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="24" fill="#f7f9fd"/><text x="50" y="62" class="title">听力不是“听到每个字母”，而是三层实时加工</text><text x="50" y="96" class="subtitle">看得懂文字，不代表已能从连续语流中听出词块。</text><rect x="42" y="160" rx="16" width="365" height="215" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="60" y="209" class="h">1. 听觉辨认</text><text x="60" y="270" class="d">辨出声音 / 重音 / 弱读</text><rect x="436" y="160" rx="16" width="365" height="215" fill="#e0f4eb" stroke="#95cbb2" stroke-width="2"/><text x="454" y="209" class="h">2. 词块切分</text><text x="454" y="270" class="d">抓住连贯的表达单位</text><rect x="830" y="160" rx="16" width="365" height="215" fill="#fff0d9" stroke="#dfba82" stroke-width="2"/><text x="848" y="209" class="h">3. 实时理解</text><text x="848" y="270" class="d">人物 / 事件 / 说话意图</text><path d="M410 268 H433 M807 268 H830" class="path"/><text x="49" y="426" class="subtitle">先听 → 定位听不清处 → 对照文字 → 重听并复述；仅看字幕不等于听力训练。</text></svg>