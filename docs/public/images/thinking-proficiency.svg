<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"><title>真正学会一个表达，要经历四种不同测试</title><desc>不能把“看见答案觉得熟悉”当作已经会用。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253550}.title{font-size:28px;font-weight:750}.subtitle{font-size:17px;fill:#60748e}.h{font-size:22px;font-weight:700}.d{font-size:19px;fill:#536880}.v{font-size:23px}.path{fill:none;stroke:#81a0bf;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="24" fill="#f7f9fd"/><text x="50" y="62" class="title">真正学会一个表达，要经历四种不同测试</text><text x="50" y="96" class="subtitle">不能把“看见答案觉得熟悉”当作已经会用。</text><rect x="41" y="156" rx="16" width="280" height="219" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="59" y="203" class="h">1. 识别</text><text x="59" y="266" class="d">读到能明白</text><rect x="336" y="156" rx="16" width="280" height="219" fill="#e0f4eb" stroke="#95cbb2" stroke-width="2"/><text x="354" y="203" class="h">2. 主动提取</text><text x="354" y="266" class="d">只看情境能说</text><rect x="631" y="156" rx="16" width="280" height="219" fill="#fff0d9" stroke="#dfba82" stroke-width="2"/><text x="649" y="203" class="h">3. 迁移</text><text x="649" y="266" class="d">换情境仍正确</text><rect x="926" y="156" rx="16" width="280" height="219" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="944" y="203" class="h">4. 保持</text><text x="944" y="266" class="d">隔天仍能调用</text><text x="47" y="427" class="subtitle">理解准确、表达恰当和迁移稳定，比“不许想中文”更可检验。</text></svg>