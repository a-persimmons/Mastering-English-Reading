<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-label="英语思维训练的五步循环"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#223451}.title{font-weight:700;font-size:30px}.t{font-size:20px;font-weight:650}.s{font-size:16px;fill:#526b88}.arr{stroke:#7297c6;stroke-width:3;fill:none;stroke-linecap:round}</style><rect width="1120" height="440" rx="24" fill="#f6f9ff"/><text class="title" x="45" y="60">英语思维：从理解情境到主动调用表达</text><rect x="42" y="130" width="198" height="150" rx="20" fill="#e1eefe" stroke="#86acd9" stroke-width="2"/><text class="t" x="60" y="187">① 情境输入</text><text class="s" x="60" y="226">人物 / 动作 / 意图</text><path class="arr" d="M242 204h14"/><path class="arr" d="M248 198l8 6-8 6"/><rect x="257" y="130" width="198" height="150" rx="20" fill="#e3f7ef" stroke="#83c7b0" stroke-width="2"/><text class="t" x="275" y="187">② 意义确认</text><text class="s" x="275" y="226">事实是否理解准确</text><path class="arr" d="M457 204h14"/><path class="arr" d="M463 198l8 6-8 6"/><rect x="472" y="130" width="198" height="150" rx="20" fill="#e1eefe" stroke="#86acd9" stroke-width="2"/><text class="t" x="490" y="187">③ 留意英语</text><text class="s" x="490" y="226">句型 / 词块 / 搭配</text><path class="arr" d="M672 204h14"/><path class="arr" d="M678 198l8 6-8 6"/><rect x="687" y="130" width="198" height="150" rx="20" fill="#e3f7ef" stroke="#83c7b0" stroke-width="2"/><text class="t" x="705" y="187">④ 遮住答案</text><text class="s" x="705" y="226">主动回忆与输出</text><path class="arr" d="M887 204h14"/><path class="arr" d="M893 198l8 6-8 6"/><rect x="902" y="130" width="198" height="150" rx="20" fill="#e1eefe" stroke="#86acd9" stroke-width="2"/><text class="t" x="920" y="187">⑤ 替换情境</text><text class="s" x="920" y="226">迁移、反馈与复测</text><path class="arr" d="M1009 290v68H147v-65"/><path class="arr" d="M141 304l6-12 6 12"/><text class="s" x="430" y="342">隔天再练 · 新场景复测 · 错误反馈</text></svg>