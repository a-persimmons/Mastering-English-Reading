<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>不是所有句子都按普通主谓顺序开头</title><desc>三个常见结构的第一反应：存在、占位主语、祈使。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#243652}.h{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#637994}.lab{font-size:23px;font-weight:700}.en{font-size:22px}.cn{font-size:18px;fill:#566b83}.wire{fill:none;stroke:#829dc2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="23" fill="#f7f9fd"/><text x="50" y="63" class="h">不是所有句子都按普通主谓顺序开头</text><text x="50" y="95" class="sub">三个常见结构的第一反应：存在、占位主语、祈使。</text><rect x="45" y="146" rx="17" width="365" height="230" fill="#e7f0ff" stroke="#9cbbe2" stroke-width="2"/><text x="65" y="200" class="lab">There be</text><text x="65" y="258" class="en">There is a cat ...</text><text x="65" y="319" class="cn">说“某处有某物”</text><rect x="435" y="146" rx="17" width="365" height="230" fill="#e2f4ec" stroke="#99cbb4" stroke-width="2"/><text x="455" y="200" class="lab">形式主语 it</text><text x="455" y="258" class="en">It is important to read.</text><text x="455" y="319" class="cn">真正要说的是阅读这件事</text><rect x="825" y="146" rx="17" width="365" height="230" fill="#fff0dc" stroke="#ddbd89" stroke-width="2"/><text x="845" y="200" class="lab">祈使句</text><text x="845" y="258" class="en">Close the door, please.</text><text x="845" y="319" class="cn">主语 you 通常不写出</text><text x="53" y="425" class="sub">分析时先恢复事件意义，不要机械地把第一个单词译成普通主语。</text></svg>