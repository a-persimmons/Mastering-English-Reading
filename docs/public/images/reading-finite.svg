<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" role="img" aria-labelledby="title desc"><title id="title">一个句子出现多个动词：先分清归属</title><desc id="desc">The girl who was sitting by the door suddenly stood up.</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#20324b}.t{font-size:29px;font-weight:750}.s{font-size:17px;fill:#61738c}.h{font-size:23px;font-weight:700}.v{font-size:24px;font-weight:650}.d{font-size:18px;fill:#526783}.tiny{font-size:16px;fill:#586b82}.stroke{stroke:#799cc2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="468" rx="24" fill="#f8fafd"/><text x="52" y="65" class="t">一个句子出现多个动词：先分清归属</text><text x="52" y="99" class="s">The girl who was sitting by the door suddenly stood up.</text><rect x="50" y="144" width="528" height="246" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><rect x="622" y="144" width="528" height="246" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="80" y="191" class="h">主句谓语</text><text x="80" y="239" class="v">stood up</text><text x="80" y="285" class="d">The girl ... stood up.</text><text x="80" y="330" class="d">“那个女孩突然站了起来”</text><text x="652" y="191" class="h">定语从句的谓语</text><text x="652" y="239" class="v">was sitting</text><text x="652" y="285" class="d">who was sitting by the door</text><text x="652" y="330" class="d">“坐在门边的那位”</text><text x="55" y="434" class="s">看见两个动词组，不等于看见两个独立主句。</text></svg>