<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="英语句子学习结构图"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#14233e}.ttl{font-size:29px;font-weight:750}.sub{font-size:18px;fill:#59708e}.t{font-size:22px;font-weight:600}.small{font-size:17px;fill:#526781}.blue{fill:#dceaff;stroke:#6a9bda;stroke-width:2}.warm{fill:#fff1d7;stroke:#deb26c;stroke-width:2}.mint{fill:#def5ee;stroke:#71bb9d;stroke-width:2}.wire{stroke:#7990ad;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="25" fill="#f7f9fd"/><text x="48" y="65" class="ttl">一眼看懂长句的六步工作流</text><rect x="48" y="135" width="340" height="120" rx="19" class="blue"/><text x="72" y="190" class="t">1 找谓语</text><text x="72" y="226" class="small">找限定谓语组</text><rect x="434" y="135" width="340" height="120" rx="19" class="mint"/><text x="458" y="190" class="t">2 锁主干</text><text x="458" y="226" class="small">谁发生了什么？</text><rect x="820" y="135" width="340" height="120" rx="19" class="warm"/><text x="844" y="190" class="t">3 分意群</text><text x="844" y="226" class="small">按短语和从句切块</text><rect x="48" y="330" width="340" height="120" rx="19" class="blue"/><text x="72" y="385" class="t">4 画关系</text><text x="72" y="421" class="small">谁修饰谁、什么逻辑？</text><rect x="434" y="330" width="340" height="120" rx="19" class="mint"/><text x="458" y="385" class="t">5 理解 / 猜词</text><text x="458" y="421" class="small">保住事实，推测未知</text><rect x="820" y="330" width="340" height="120" rx="19" class="warm"/><text x="844" y="385" class="t">6 核对意译</text><text x="844" y="421" class="small">否定 / 情态 / 指代</text><path class="wire" d="M395 194 H427 M782 194 H813 M590 264 V306 M782 365 H813 M395 365 H427" /><text x="48" y="548" class="sub">熟练后可以跳步；遇到歧义时，回到上一层检查证据。</text></svg>