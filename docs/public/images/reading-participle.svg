<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>doing / done：谁执行动作？谁承受动作？</title><desc>以同一相机与女孩的关系为例。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#203651}.h{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#66798c}.label{font-size:22px;font-weight:bold}.ex{font-size:22px}.detail{font-size:18px;fill:#526b80}.wire{fill:none;stroke:#7b9cbc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="62" class="h">doing / done：谁执行动作？谁承受动作？</text><text x="45" y="95" class="sub">以同一相机与女孩的关系为例。</text><rect x="45" y="145" width="543" height="219" rx="16" fill="#e3efff" stroke="#94b5dc" stroke-width="2"/><text x="64" y="190" class="label">主动关系</text><text x="64" y="238" class="ex">the girl holding a camera</text><text x="64" y="300" class="detail">女孩在拿着相机</text><rect x="612" y="145" width="543" height="219" rx="16" fill="#e2f5ed" stroke="#97cdb6" stroke-width="2"/><text x="631" y="190" class="label">受动关系</text><text x="631" y="238" class="ex">the camera held by the girl</text><text x="631" y="300" class="detail">相机被女孩拿着</text><text x="54" y="419" class="sub">分词不单独决定绝对时间；要根据整个句子确定时间与状态。</text></svg>