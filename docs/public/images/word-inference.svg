<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="英语句子学习结构图"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#14233e}.ttl{font-size:29px;font-weight:750}.sub{font-size:18px;fill:#59708e}.t{font-size:22px;font-weight:600}.small{font-size:17px;fill:#526781}.blue{fill:#dceaff;stroke:#6a9bda;stroke-width:2}.warm{fill:#fff1d7;stroke:#deb26c;stroke-width:2}.mint{fill:#def5ee;stroke:#71bb9d;stroke-width:2}.wire{stroke:#7990ad;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="25" fill="#f7f9fd"/><text x="55" y="62" class="ttl">陌生词不是“猜谜”：让证据逐步缩小范围</text><rect x="70" y="135" width="259" height="113" rx="18" class="blue"/><text x="92" y="190" class="small">未知词：它在哪个槽位？</text><path class="wire" d="M330 190 H352"/><rect x="358" y="210" width="259" height="113" rx="18" class="mint"/><text x="380" y="265" class="small">词形：前缀、词根、后缀</text><path class="wire" d="M618 265 H640"/><rect x="646" y="135" width="259" height="113" rx="18" class="warm"/><text x="668" y="190" class="small">上下文：解释、对比、因果</text><path class="wire" d="M906 190 H928"/><rect x="934" y="210" width="259" height="113" rx="18" class="blue"/><text x="956" y="265" class="small">候选词义 + 可信程度</text><rect x="254" y="400" width="694" height="100" rx="19" class="mint"/><text x="291" y="443" class="t">关键结论受影响？→ 查字典或原文资料验证</text><text x="291" y="476" class="small">猜不出具体义，也可以先保留语义类别并继续阅读</text></svg>