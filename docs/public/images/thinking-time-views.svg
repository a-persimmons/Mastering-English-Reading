<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>发生了什么，还要交代何时、以什么视角看它</title><desc>同样是 read，表达习惯、正在进行或事件与现在的关联。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253652}.big{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#657993}.hd{font-size:23px;font-weight:700}.text{font-size:21px}.info{font-size:18px;fill:#536982}.line{stroke:#839ebf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f7f9fc"/><text x="51" y="63" class="big">发生了什么，还要交代何时、以什么视角看它</text><text x="51" y="97" class="sub">同样是 read，表达习惯、正在进行或事件与现在的关联。</text><rect x="45" y="147" width="352" height="224" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="73" y="192" class="hd">习惯</text><text x="73" y="249" class="text">I read every night.</text><text x="73" y="312" class="info">重复性的活动</text><rect x="423" y="147" width="352" height="224" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="451" y="192" class="hd">进行中的过程</text><text x="451" y="249" class="text">I'm reading now.</text><text x="451" y="312" class="info">当前进行</text><rect x="801" y="147" width="352" height="224" rx="17" fill="#fff1d8" stroke="#ddbc83" stroke-width="2"/><text x="826" y="192" class="hd">完成体的视角</text><text x="826" y="249" class="text">I've read the book.</text><text x="826" y="312" class="info">关联当前的经验/结果</text><text x="52" y="422" class="sub">不能仅凭形式决定“读过”还是“读完”，仍要参考语境。</text></svg>