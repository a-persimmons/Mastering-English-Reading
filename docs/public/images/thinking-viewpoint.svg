<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>同一个事件，从谁的角度讲？</title><desc>主语的选择通常跟当前对话已经关注的对象有关。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253652}.big{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#657993}.hd{font-size:23px;font-weight:700}.text{font-size:21px}.info{font-size:18px;fill:#536982}.line{stroke:#839ebf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f7f9fc"/><text x="51" y="63" class="big">同一个事件，从谁的角度讲？</text><text x="51" y="97" class="sub">主语的选择通常跟当前对话已经关注的对象有关。</text><rect x="48" y="145" width="529" height="234" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="76" y="192" class="hd">当前在谈猫</text><text x="76" y="248" class="text">What did the cat do?</text><text x="76" y="298" class="info">The cat knocked over the cup.</text><text x="76" y="340" class="info">主动句突出动作发起者</text><rect x="623" y="145" width="529" height="234" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="650" y="192" class="hd">当前在谈杯子</text><text x="650" y="248" class="text">What happened to the cup?</text><text x="650" y="298" class="info">The cup was knocked over.</text><text x="650" y="340" class="info">被动句突出受影响对象</text><text x="60" y="429" class="sub">两个句子可以描述同一事件，但不必假定每次都适用同一个对话。</text></svg>