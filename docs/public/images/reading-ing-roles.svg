<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>同一个 -ing，可能有三种身份</title><desc>先检查整块 -ing 在句子中的位置，不要凭后缀断言它“正在进行”。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#203651}.h{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#66798c}.label{font-size:22px;font-weight:bold}.ex{font-size:22px}.detail{font-size:18px;fill:#526b80}.wire{fill:none;stroke:#7b9cbc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="62" class="h">同一个 -ing，可能有三种身份</text><text x="45" y="95" class="sub">先检查整块 -ing 在句子中的位置，不要凭后缀断言它“正在进行”。</text><rect x="45" y="145" width="354" height="219" rx="16" fill="#e3efff" stroke="#94b5dc" stroke-width="2"/><text x="64" y="190" class="label">动名词 · 主语</text><text x="64" y="238" class="ex">Reading is useful.</text><text x="64" y="300" class="detail">阅读这件事有用</text><rect x="423" y="145" width="354" height="219" rx="16" fill="#e2f5ed" stroke="#97cdb6" stroke-width="2"/><text x="442" y="190" class="label">分词 · 修饰语</text><text x="442" y="238" class="ex">The girl reading ...</text><text x="442" y="300" class="detail">正在读书的女孩</text><rect x="801" y="145" width="354" height="219" rx="16" fill="#fff1dc" stroke="#e4bd85" stroke-width="2"/><text x="820" y="190" class="label">进行体 · 谓语组</text><text x="820" y="238" class="ex">She is reading.</text><text x="820" y="300" class="detail">她正在读书</text><text x="54" y="419" class="sub">形式相同，功能可以不同；尤其要识别 is reading 是一个完整谓语组。</text></svg>