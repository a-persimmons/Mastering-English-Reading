<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"><title>想要、考虑、计划、已经决定：程度不同</title><desc>先判断自己的真实意图，不是把所有中文“想”都换成 think。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253550}.title{font-size:28px;font-weight:750}.subtitle{font-size:17px;fill:#60748e}.h{font-size:22px;font-weight:700}.d{font-size:19px;fill:#536880}.v{font-size:23px}.path{fill:none;stroke:#81a0bf;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="24" fill="#f7f9fd"/><text x="50" y="62" class="title">想要、考虑、计划、已经决定：程度不同</text><text x="50" y="96" class="subtitle">先判断自己的真实意图，不是把所有中文“想”都换成 think。</text><rect x="40" y="152" rx="16" width="279" height="228" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="58" y="198" class="h">希望</text><text x="58" y="253" class="v">I hope to visit ...</text><text x="58" y="308" class="d">愿望</text><rect x="335" y="152" rx="16" width="279" height="228" fill="#e0f4eb" stroke="#95cbb2" stroke-width="2"/><text x="353" y="198" class="h">考虑</text><text x="353" y="253" class="v">I'm thinking about ...</text><text x="353" y="308" class="d">尚未决定</text><rect x="630" y="152" rx="16" width="279" height="228" fill="#fff0d9" stroke="#dfba82" stroke-width="2"/><text x="648" y="198" class="h">计划</text><text x="648" y="253" class="v">I'm planning to ...</text><text x="648" y="308" class="d">有具体安排</text><rect x="925" y="152" rx="16" width="279" height="228" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="943" y="198" class="h">决定</text><text x="943" y="253" class="v">I've decided to ...</text><text x="943" y="308" class="d">已作决定</text><text x="52" y="433" class="subtitle">“希望”不等于“已经订票”；表达承诺与事实时尤其要准确。</text></svg>