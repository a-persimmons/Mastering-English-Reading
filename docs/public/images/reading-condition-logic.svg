<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>事实、时间与条件：哪一件事情真的发生了？</title><desc>同样会出现 when / if / because，但它们给出的关系不同。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#243652}.h{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#637994}.lab{font-size:23px;font-weight:700}.en{font-size:22px}.cn{font-size:18px;fill:#566b83}.wire{fill:none;stroke:#829dc2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="23" fill="#f7f9fd"/><text x="50" y="63" class="h">事实、时间与条件：哪一件事情真的发生了？</text><text x="50" y="95" class="sub">同样会出现 when / if / because，但它们给出的关系不同。</text><rect x="44" y="147" rx="17" width="370" height="#e7f0ff" fill="227" stroke="#ddbd89" stroke-width="2"/><text x="62" y="192" class="lab">时间</text><text x="62" y="249" class="en">When the rain stopped, ...</text><text x="62" y="309" class="cn">告诉你主句发生的时间</text><rect x="434" y="147" rx="17" width="370" height="#e2f4ec" fill="227" stroke="#ddbd89" stroke-width="2"/><text x="452" y="192" class="lab">原因</text><text x="452" y="249" class="en">Because the road closed, ...</text><text x="452" y="309" class="cn">作者明确交代理由</text><rect x="824" y="147" rx="17" width="370" height="#fff0dc" fill="227" stroke="#ddbd89" stroke-width="2"/><text x="842" y="192" class="lab">条件</text><text x="842" y="249" class="en">If it rains tomorrow, ...</text><text x="842" y="309" class="cn">提出尚未确认的前提</text><text x="55" y="424" class="sub">尤其注意：if 不会自动证明“明天真的会下雨”。</text></svg>