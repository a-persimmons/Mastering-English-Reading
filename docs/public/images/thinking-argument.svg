<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 370" role="img" aria-label="用英语思考：观察、假设、行动要分开"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#203453}.title{font-weight:700;font-size:28px}.label{font-weight:650;font-size:21px}.small{font-size:17px;fill:#52657c}.line{fill:none;stroke:#6f9bc9;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:#e7f0ff;stroke:#82a6d2;stroke-width:2}.b{fill:#e1f4ed;stroke:#7dbca1;stroke-width:2}.c{fill:#fff2dc;stroke:#d7b276;stroke-width:2}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="58" class="title">用英语思考：观察、假设、行动要分开</text><rect x="40" y="114" width="347" height="122" rx="17" class="a"/><text x="58" y="156" class="label">观察 Observation</text><text x="58" y="187" class="small">页面在我的手机上加载慢</text><path class="line" d="M391 177 L414 177"/><path class="line" d="M405 170 L414 177 L405 184"/><rect x="425" y="114" width="348" height="122" rx="17" class="c"/><text x="443" y="156" class="label">假设 Hypothesis</text><text x="443" y="187" class="small">也许与图片加载有关</text><path class="line" d="M779 177 L802 177"/><path class="line" d="M793 170 L802 177 L793 184"/><rect x="813" y="114" width="330" height="122" rx="17" class="b"/><text x="831" y="156" class="label">下一步 Next step</text><text x="831" y="187" class="small">测量、复现，再决定修改</text><text x="68" y="305" class="small">不要把“可能的原因”写成“已证实的根因”，先检查证据</text></svg>