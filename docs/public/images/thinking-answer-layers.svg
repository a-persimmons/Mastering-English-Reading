<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>快速回应时：先说核心，再补充，再确认</title><desc>回应正确的问题，比先拼一段完整的长句更重要。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#243652}.h{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#637994}.lab{font-size:23px;font-weight:700}.en{font-size:22px}.cn{font-size:18px;fill:#566b83}.wire{fill:none;stroke:#829dc2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="23" fill="#f7f9fd"/><text x="50" y="63" class="h">快速回应时：先说核心，再补充，再确认</text><text x="50" y="95" class="sub">回应正确的问题，比先拼一段完整的长句更重要。</text><rect x="44" y="148" rx="17" width="370" height="#e7f0ff" fill="228" stroke="#ddbd89" stroke-width="2"/><text x="64" y="196" class="lab">1. 核心答案</text><text x="64" y="256" class="en">The bus was late.</text><text x="64" y="319" class="cn">直接回答原因</text><rect x="434" y="148" rx="17" width="370" height="#e2f4ec" fill="228" stroke="#ddbd89" stroke-width="2"/><text x="454" y="196" class="lab">2. 补充细节</text><text x="454" y="256" class="en">I waited for 20 minutes.</text><text x="454" y="319" class="cn">只加对话需要的信息</text><rect x="824" y="148" rx="17" width="370" height="#fff0dc" fill="228" stroke="#ddbd89" stroke-width="2"/><text x="844" y="196" class="lab">3. 必要时确认</text><text x="844" y="256" class="en">Did you mean today?</text><text x="844" y="319" class="cn">不懂时主动澄清</text><text x="50" y="428" class="sub">对方问时间就回答时间；对方问原因就先给原因。</text></svg>