<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>目的 so that 与结果 so ... that</title><desc>都可能出现 so / that，但它们表达的逻辑方向不同。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#203651}.h{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#66798c}.label{font-size:22px;font-weight:bold}.ex{font-size:22px}.detail{font-size:18px;fill:#526b80}.wire{fill:none;stroke:#7b9cbc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="62" class="h">目的 so that 与结果 so ... that</text><text x="45" y="95" class="sub">都可能出现 so / that，但它们表达的逻辑方向不同。</text><rect x="55" y="155" width="520" height="218" rx="16" fill="#e3efff" stroke="#94b5dc" stroke-width="2"/><text x="82" y="197" class="label">目的：为了让某事发生</text><text x="82" y="243" class="ex">She spoke slowly</text><text x="82" y="285" class="ex">so that everyone could understand.</text><text x="82" y="326" class="detail">想实现的目标：让大家听懂</text><rect x="625" y="155" width="520" height="218" rx="16" fill="#e2f5ed" stroke="#97cdb6" stroke-width="2"/><text x="652" y="197" class="label">结果：程度引出实际后果</text><text x="652" y="243" class="ex">She spoke so slowly</text><text x="652" y="285" class="ex">that everyone understood.</text><text x="652" y="326" class="detail">慢到大家都听懂的程度</text><text x="58" y="425" class="sub">不能将结果句译为“故意为了造成某个结果”。</text></svg>