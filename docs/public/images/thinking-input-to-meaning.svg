<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 380" role="img" aria-label="读英文：从整体意义出发，必要时回退分析"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#203453}.title{font-weight:700;font-size:28px}.label{font-weight:650;font-size:21px}.small{font-size:17px;fill:#52657c}.line{fill:none;stroke:#6f9bc9;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:#e7f0ff;stroke:#82a6d2;stroke-width:2}.b{fill:#e1f4ed;stroke:#7dbca1;stroke-width:2}.c{fill:#fff2dc;stroke:#d7b276;stroke-width:2}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="58" class="title">读英文：从整体意义出发，必要时回退分析</text><rect x="58" y="125" width="275" height="116" rx="17" class="a"/><text x="76" y="167" class="label">先读整体</text><text x="76" y="198" class="small">人物 / 事件 / 目的</text><path class="line" d="M339 178 L382 178"/><path class="line" d="M373 171 L382 178 L373 185"/><rect x="393" y="125" width="333" height="116" rx="17" class="b"/><text x="411" y="167" class="label">只处理卡点</text><text x="411" y="198" class="small">词块 / 从句 / 否定</text><path class="line" d="M732 178 L773 178"/><path class="line" d="M764 171 L773 178 L764 185"/><rect x="784" y="125" width="325" height="116" rx="17" class="c"/><text x="802" y="167" class="label">复述意义</text><text x="802" y="198" class="small">不看译文说出事实</text><path class="line" d="M936 248 V315 H195 V247"/><text x="444" y="307" class="small">未读懂时回到结构分析；读懂后重新直读</text></svg>