<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">一个句子，几种不同的信息角色</title><desc id="desc">My sister bought a small camera last week.</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#20324b}.t{font-size:29px;font-weight:750}.s{font-size:17px;fill:#61738c}.h{font-size:23px;font-weight:700}.v{font-size:24px;font-weight:650}.d{font-size:18px;fill:#526783}.tiny{font-size:16px;fill:#586b82}.stroke{stroke:#799cc2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f8fafd"/><text x="52" y="65" class="t">一个句子，几种不同的信息角色</text><text x="52" y="99" class="s">My sister bought a small camera last week.</text><rect x="47" y="166" width="270" height="160" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><text x="63" y="224" class="h">My sister</text><text x="63" y="277" class="d">谁？主语</text><path d="M319 246 L335 246" class="stroke"/><path d="M326 239 L335 246 L326 253" class="stroke"/><rect x="338" y="166" width="270" height="160" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="354" y="224" class="h">bought</text><text x="354" y="277" class="d">做了什么？谓语</text><path d="M610 246 L626 246" class="stroke"/><path d="M617 239 L626 246 L617 253" class="stroke"/><rect x="629" y="166" width="270" height="160" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><text x="645" y="224" class="h">a small camera</text><text x="645" y="277" class="d">买了什么？宾语</text><path d="M901 246 L917 246" class="stroke"/><path d="M908 239 L917 246 L908 253" class="stroke"/><rect x="920" y="166" width="270" height="160" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="936" y="224" class="h">last week</text><text x="936" y="277" class="d">何时？状语</text><text x="55" y="405" class="s">注意：small 在宾语短语内部作定语；宾语是整个 a small camera。</text></svg>