<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>定语从句：它修饰谁，内部缺什么？</title><desc>The book that I bought yesterday is interesting.</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#203651}.h{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#66798c}.label{font-size:22px;font-weight:bold}.ex{font-size:22px}.detail{font-size:18px;fill:#526b80}.wire{fill:none;stroke:#7b9cbc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="62" class="h">定语从句：它修饰谁，内部缺什么？</text><text x="45" y="95" class="sub">The book that I bought yesterday is interesting.</text><rect x="105" y="157" width="410" height="185" rx="16" fill="#e3efff" stroke="#94b5dc" stroke-width="2"/><text x="139" y="210" class="label">主句主干</text><text x="139" y="259" class="ex">The book is interesting.</text><text x="139" y="302" class="detail">这本书很有意思</text><rect x="680" y="157" width="410" height="185" rx="16" fill="#e2f5ed" stroke="#97cdb6" stroke-width="2"/><text x="709" y="210" class="label">修饰 book 的从句</text><text x="709" y="259" class="ex">that I bought yesterday</text><text x="709" y="303" class="detail">I bought [the book] yesterday</text><path class="wire" d="M513 244 H673"/><text x="533" y="225" class="sub">修饰</text><text x="82" y="414" class="sub">that 在从句内代表 book（bought 的宾语）；不是看到 that 就都叫定语从句。</text></svg>