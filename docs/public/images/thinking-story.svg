<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"><title>讲一段经历：六格就能把事件说清楚</title><desc>不必每次都凑复杂句；按事实顺序组织即可。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253550}.title{font-size:28px;font-weight:750}.subtitle{font-size:17px;fill:#60748e}.h{font-size:22px;font-weight:700}.d{font-size:19px;fill:#536880}.v{font-size:23px}.path{fill:none;stroke:#81a0bf;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="24" fill="#f7f9fd"/><text x="50" y="62" class="title">讲一段经历：六格就能把事件说清楚</text><text x="50" y="96" class="subtitle">不必每次都凑复杂句；按事实顺序组织即可。</text><rect x="40" y="158" rx="16" width="180" height="205" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="52" y="207" class="h">1 背景</text><text x="52" y="274" class="d">在哪里？</text><rect x="237" y="158" rx="16" width="180" height="205" fill="#e0f4eb" stroke="#95cbb2" stroke-width="2"/><text x="249" y="207" class="h">2 触发</text><text x="249" y="274" class="d">发生什么？</text><rect x="434" y="158" rx="16" width="180" height="205" fill="#fff0d9" stroke="#dfba82" stroke-width="2"/><text x="446" y="207" class="h">3 行动</text><text x="446" y="274" class="d">我做了什么？</text><rect x="631" y="158" rx="16" width="180" height="205" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="643" y="207" class="h">4 障碍</text><text x="643" y="274" class="d">遇到什么？</text><rect x="828" y="158" rx="16" width="180" height="205" fill="#e0f4eb" stroke="#95cbb2" stroke-width="2"/><text x="840" y="207" class="h">5 结果</text><text x="840" y="274" class="d">后来怎样？</text><rect x="1025" y="158" rx="16" width="180" height="205" fill="#fff0d9" stroke="#dfba82" stroke-width="2"/><text x="1037" y="207" class="h">6 感受</text><text x="1037" y="274" class="d">我的反应？</text><text x="52" y="418" class="subtitle">没有事实可填的一格可以跳过；不要为了把故事讲“完整”而编造细节。</text></svg>