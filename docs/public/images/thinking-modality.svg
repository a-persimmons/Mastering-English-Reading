<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>表达判断时，哪些词在保留不确定性？</title><desc>表达强弱不是百分比刻度，下面只标出常见功能差异。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253652}.big{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#657993}.hd{font-size:23px;font-weight:700}.text{font-size:21px}.info{font-size:18px;fill:#536982}.line{stroke:#839ebf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f7f9fc"/><text x="51" y="63" class="big">表达判断时，哪些词在保留不确定性？</text><text x="51" y="97" class="sub">表达强弱不是百分比刻度，下面只标出常见功能差异。</text><rect x="45" y="145" width="351" height="213" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="67" y="193" class="hd">直接陈述</text><text x="67" y="250" class="text">It is raining.</text><text x="67" y="299" class="info">陈述一个当前事实</text><rect x="424" y="145" width="351" height="213" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="446" y="193" class="hd">推测可能</text><text x="446" y="250" class="text">It may rain.</text><text x="446" y="299" class="info">保留发生的可能性</text><rect x="803" y="145" width="351" height="213" rx="17" fill="#fff1d8" stroke="#ddbc83" stroke-width="2"/><text x="825" y="193" class="hd">较强确信</text><text x="825" y="250" class="text">It will probably rain.</text><text x="825" y="299" class="info">表达较强的预期</text><text x="51" y="417" class="sub">不同语境下 might / may / probably 的力度会变化，不能给它们固定数值。</text></svg>