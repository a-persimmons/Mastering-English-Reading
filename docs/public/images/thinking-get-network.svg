<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>一个 get：不同场景中的不同事件关系</title><desc>从“得到”这个中文标签，扩展到更可用的英语词块网络。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253652}.big{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#657993}.hd{font-size:23px;font-weight:700}.text{font-size:21px}.info{font-size:18px;fill:#536982}.line{stroke:#839ebf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f7f9fc"/><text x="51" y="63" class="big">一个 get：不同场景中的不同事件关系</text><text x="51" y="97" class="sub">从“得到”这个中文标签，扩展到更可用的英语词块网络。</text><rect x="448" y="133" width="300" height="80" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="565" y="183" class="hd">get</text><path class="line" d="M596 213 V253 M225 253 H970 M225 253 V277 M474 253 V277 M720 253 V277 M970 253 V277"/><rect x="46" y="279" width="269" height="109" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="65" y="323" class="hd">get a message</text><text x="65" y="359" class="info">收到消息</text><rect x="336" y="279" width="269" height="109" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="355" y="323" class="hd">get home</text><text x="355" y="359" class="info">到达家里</text><rect x="626" y="279" width="269" height="109" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="645" y="323" class="hd">get tired</text><text x="645" y="359" class="info">变得疲劳</text><rect x="916" y="279" width="269" height="109" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="935" y="323" class="hd">get ready</text><text x="935" y="359" class="info">准备好</text><text x="57" y="431" class="sub">相同词形，不代表每个场景都能机械翻译成“得到”。</text></svg>