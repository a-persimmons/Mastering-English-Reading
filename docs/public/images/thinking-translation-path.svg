<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>从逐词翻译走向情境直接调用</title><desc>中文不是敌人；训练目的是减少熟悉表达中的不必要中介。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253652}.big{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#657993}.hd{font-size:23px;font-weight:700}.text{font-size:21px}.info{font-size:18px;fill:#536982}.line{stroke:#839ebf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="470" rx="24" fill="#f7f9fc"/><text x="51" y="63" class="big">从逐词翻译走向情境直接调用</text><text x="51" y="97" class="sub">中文不是敌人；训练目的是减少熟悉表达中的不必要中介。</text><rect x="48" y="145" width="517" height="260" rx="17" fill="#e6efff" stroke="#98b7df" stroke-width="2"/><text x="75" y="191" class="hd">早期常见路径</text><text x="75" y="232" class="info">1. 真实情境</text><text x="75" y="277" class="info">2. 先形成中文句子</text><text x="75" y="322" class="info">3. 逐个找英文词</text><text x="75" y="367" class="info">4. 再调整语序</text><rect x="634" y="145" width="517" height="260" rx="17" fill="#e1f4ed" stroke="#95c9b2" stroke-width="2"/><text x="660" y="191" class="hd">逐渐更熟练的路径</text><text x="660" y="244" class="text">真实情境 / 表达意图</text><path class="line" d="M864 261 V306"/><text x="660" y="342" class="text">英语词块 + 合适的结构</text><text x="70" y="447" class="sub">复杂表达仍可以借中文核对；熟悉情境则尝试直接生成英语。</text></svg>