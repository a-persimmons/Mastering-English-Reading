<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>代词与省略：有时回指名词，有时回指整件事</title><desc>Tom left his umbrella at school. When he returned, it was gone.</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#203651}.h{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#66798c}.label{font-size:22px;font-weight:bold}.ex{font-size:22px}.detail{font-size:18px;fill:#526b80}.wire{fill:none;stroke:#7b9cbc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="62" class="h">代词与省略：有时回指名词，有时回指整件事</text><text x="45" y="95" class="sub">Tom left his umbrella at school. When he returned, it was gone.</text><rect x="63" y="152" width="328" height="132" rx="16" fill="#e3efff" stroke="#94b5dc" stroke-width="2"/><text x="89" y="201" class="label">Tom</text><text x="89" y="247" class="detail">人：he → Tom</text><rect x="444" y="152" width="328" height="132" rx="16" fill="#e2f5ed" stroke="#97cdb6" stroke-width="2"/><text x="465" y="201" class="label">umbrella</text><text x="465" y="247" class="detail">物：it → umbrella</text><rect x="823" y="152" width="328" height="132" rx="16" fill="#fff1dc" stroke="#e4bd85" stroke-width="2"/><text x="845" y="201" class="label">was gone</text><text x="845" y="247" class="detail">结果：伞不见了</text><path class="wire" d="M394 218 H435 M775 218 H815"/><text x="74" y="345" class="detail">原句没有交代伞被谁拿走；“被偷了”属于未经证实的补充。</text><text x="74" y="392" class="sub">遇到指代歧义，要回看前后句，而不是只找最近的名词。</text></svg>