<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img"><title>忘记一个单词？用已知英语绕述它</title><desc>以 stapler（订书机）为例：说明类别、功能与特征。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#253550}.title{font-size:28px;font-weight:750}.subtitle{font-size:17px;fill:#60748e}.h{font-size:22px;font-weight:700}.d{font-size:19px;fill:#536880}.v{font-size:23px}.path{fill:none;stroke:#81a0bf;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}</style><rect width="100%" height="100%" rx="24" fill="#f7f9fd"/><text x="50" y="62" class="title">忘记一个单词？用已知英语绕述它</text><text x="50" y="96" class="subtitle">以 stapler（订书机）为例：说明类别、功能与特征。</text><rect x="370" y="135" rx="16" width="464" height="77" fill="#e0f4eb" stroke="#95cbb2" stroke-width="2"/><text x="413" y="183" class="h">a stapler  （目标词）</text><path d="M602 214 V260 M219 260 H978 M219 260 V287 M603 260 V287 M978 260 V287" class="path"/><rect x="40" y="289" rx="16" width="368" height="114" fill="#e5efff" stroke="#92b4df" stroke-width="2"/><text x="61" y="335" class="h">类别</text><text x="61" y="373" class="d">a small tool</text><rect x="433" y="289" rx="16" width="368" height="114" fill="#e0f4eb" stroke="#95cbb2" stroke-width="2"/><text x="454" y="335" class="h">功能</text><text x="454" y="373" class="d">joins papers together</text><rect x="826" y="289" rx="16" width="368" height="114" fill="#fff0d9" stroke="#dfba82" stroke-width="2"/><text x="847" y="335" class="h">特征</text><text x="847" y="373" class="d">often used in an office</text><text x="49" y="443" class="subtitle">临时绕述有助沟通，但事后仍应核对自然英文名称。</text></svg>