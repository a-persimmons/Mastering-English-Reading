<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="英语句子学习结构图"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#14233e}.ttl{font-size:29px;font-weight:750}.sub{font-size:18px;fill:#59708e}.t{font-size:22px;font-weight:600}.small{font-size:17px;fill:#526781}.blue{fill:#dceaff;stroke:#6a9bda;stroke-width:2}.warm{fill:#fff1d7;stroke:#deb26c;stroke-width:2}.mint{fill:#def5ee;stroke:#71bb9d;stroke-width:2}.wire{stroke:#7990ad;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="25" fill="#f7f9fd"/><text x="75" y="112" class="ttl">把长句拆成能理解的关系</text><rect x="72" y="155" width="1050" height="80" rx="15" class="blue"/><text x="100" y="204" class="t">The boy who lives next door gave me a book yesterday.</text><path class="wire" d="M590 240 V302 H339 V322 M590 302 H855 V322"/><rect x="80" y="329" width="525" height="122" rx="17" class="mint"/><text x="102" y="377" class="t">主干：The boy gave me a book.</text><text x="102" y="415" class="small">谁 → 给谁 → 什么</text><rect x="665" y="329" width="450" height="122" rx="17" class="warm"/><text x="689" y="377" class="t">补充：住在隔壁、昨天</text><text x="689" y="415" class="small">who 从句 + 时间状语</text><text x="83" y="518" class="t">住在隔壁的那个男孩，昨天给了我一本书。</text></svg>