<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-label="英语句子学习结构图"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#14233e}.ttl{font-size:29px;font-weight:750}.sub{font-size:18px;fill:#59708e}.t{font-size:22px;font-weight:600}.small{font-size:17px;fill:#526781}.blue{fill:#dceaff;stroke:#6a9bda;stroke-width:2}.warm{fill:#fff1d7;stroke:#deb26c;stroke-width:2}.mint{fill:#def5ee;stroke:#71bb9d;stroke-width:2}.wire{stroke:#7990ad;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="25" fill="#f7f9fd"/><text x="55" y="64" class="ttl">主句和从句：一棵树，而不是一条长线</text><rect x="385" y="120" width="425" height="88" rx="18" class="blue"/><text x="428" y="154" class="t">The report suggests ...</text><text x="428" y="186" class="small">最外层主句：核心判断</text><path class="wire" d="M597 208 V269 M597 269 H308 V300 M597 269 H897 V300"/><rect x="76" y="300" width="465" height="105" rx="18" class="mint"/><text x="105" y="344" class="t">that the team published ...</text><text x="105" y="380" class="small">修饰 report · 定语从句</text><rect x="672" y="300" width="457" height="105" rx="18" class="warm"/><text x="700" y="344" class="t">that the method may help ...</text><text x="700" y="380" class="small">suggests 的宾语从句</text><path class="wire" d="M899 405 V455"/><rect x="742" y="458" width="332" height="69" rx="15" class="blue"/><text x="767" y="502" class="t">who struggle ...</text></svg>