<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>词序改变了，基本事实和强调信息仍需保留</title><desc>遇到倒装和强调句时，先还原事件，再说明语气焦点。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#243652}.h{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#637994}.lab{font-size:23px;font-weight:700}.en{font-size:22px}.cn{font-size:18px;fill:#566b83}.wire{fill:none;stroke:#829dc2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="23" fill="#f7f9fd"/><text x="50" y="63" class="h">词序改变了，基本事实和强调信息仍需保留</text><text x="50" y="95" class="sub">遇到倒装和强调句时，先还原事件，再说明语气焦点。</text><rect x="55" y="144" rx="17" width="510" height="230" fill="#e7f0ff" stroke="#9cbbe2" stroke-width="2"/><text x="83" y="192" class="lab">正常词序</text><text x="83" y="245" class="en">I have never seen such a view.</text><text x="83" y="309" class="cn">核心：我从未见过</text><rect x="635" y="144" rx="17" width="510" height="230" fill="#e2f4ec" stroke="#99cbb4" stroke-width="2"/><text x="664" y="192" class="lab">否定副词前置 → 倒装</text><text x="664" y="245" class="en">Never have I seen such a view.</text><text x="664" y="309" class="cn">更突出“从来没有”</text><text x="63" y="423" class="sub">对照读出同一事件的结构变化，不能漏掉否定范围。</text></svg>