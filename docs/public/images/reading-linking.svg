<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" role="img" aria-labelledby="title desc"><title id="title">同一个 look：结构决定所表达的意思</title><desc id="desc">先看后续成分描述“主语状态”，还是表示“看”的动作。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#20324b}.t{font-size:29px;font-weight:750}.s{font-size:17px;fill:#61738c}.h{font-size:23px;font-weight:700}.v{font-size:24px;font-weight:650}.d{font-size:18px;fill:#526783}.tiny{font-size:16px;fill:#586b82}.stroke{stroke:#799cc2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="468" rx="24" fill="#f8fafd"/><text x="52" y="65" class="t">同一个 look：结构决定所表达的意思</text><text x="52" y="99" class="s">先看后续成分描述“主语状态”，还是表示“看”的动作。</text><rect x="50" y="144" width="528" height="246" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><rect x="622" y="144" width="528" height="246" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="80" y="191" class="h">主系表 · SVC</text><text x="80" y="239" class="v">She looks tired.</text><text x="80" y="285" class="d">tired 说明 She 怎么样</text><text x="80" y="330" class="d">她看起来很累</text><text x="652" y="191" class="h">行为动词 + 介词短语</text><text x="652" y="239" class="v">She looks at the screen.</text><text x="652" y="285" class="d">at the screen 表示看的对象</text><text x="652" y="330" class="d">她在看屏幕</text><text x="55" y="434" class="s">不要只凭 look 这个单词，提前决定整句意思。</text></svg>