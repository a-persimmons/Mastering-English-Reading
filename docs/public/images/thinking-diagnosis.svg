<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>真实工作场景中的英语问题调查路线</title><desc>将英文故障报告按观察、复现、核查证据和验证修复四个阶段组织</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#233754}.title{font-size:28px;font-weight:750}.sub{font-size:17px;fill:#60738b}.h{font-size:23px;font-weight:700}.d{font-size:18px;fill:#526b85}.path{stroke:#7a9ebd;stroke-width:3;fill:none;stroke-linecap:round}</style><rect width="100%" height="100%" rx="24" fill="#f8fafd"/><text class="title" x="50" y="63">用英语调查问题：观察与结论之间还隔着证据</text><text class="sub" x="50" y="95">先读懂用户报告，再澄清影响范围、复现问题并验证结果。</text><rect x="40" y="155" width="278" height="220" rx="18" fill="#e6efff" stroke="#a1b4cc" stroke-width="2"/><text x="58" y="200" class="h">1 · 用户报告</text><text x="58" y="251" class="d">Some mobile users...</text><text x="58" y="311" class="d">有人报告故障</text><rect x="334" y="155" width="278" height="220" rx="18" fill="#e2f5ed" stroke="#a1b4cc" stroke-width="2"/><text x="352" y="200" class="h">2 · 尝试复现</text><text x="352" y="251" class="d">I reproduced the issue.</text><text x="352" y="311" class="d">在明确环境中复现</text><rect x="628" y="155" width="278" height="220" rx="18" fill="#fff0dc" stroke="#a1b4cc" stroke-width="2"/><text x="646" y="200" class="h">3 · 检查证据</text><text x="646" y="251" class="d">I'm checking the logs.</text><text x="646" y="311" class="d">确认原因，而不是猜测</text><rect x="922" y="155" width="278" height="220" rx="18" fill="#e6efff" stroke="#a1b4cc" stroke-width="2"/><text x="940" y="200" class="h">4 · 验证结果</text><text x="940" y="251" class="d">The fix passed our tests.</text><text x="940" y="311" class="d">只有验证过才宣布修复</text><text x="52" y="429" class="sub">“可能因为图片加载”只是待验证假设；未确认前，不能把它写成根因。</text></svg>