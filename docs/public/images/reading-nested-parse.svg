<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>长难句拆解：从最外层到内部修饰</title><desc>The report that researchers published suggests that the method may help students.</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#203651}.h{font-size:28px;font-weight:bold}.sub{font-size:17px;fill:#66798c}.label{font-size:22px;font-weight:bold}.ex{font-size:22px}.detail{font-size:18px;fill:#526b80}.wire{fill:none;stroke:#7b9cbc;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="62" class="h">长难句拆解：从最外层到内部修饰</text><text x="45" y="95" class="sub">The report that researchers published suggests that the method may help students.</text><rect x="360" y="135" width="483" height="90" rx="16" fill="#e3efff" stroke="#94b5dc" stroke-width="2"/><text x="391" y="188" class="label">The report suggests ...</text><path class="wire" d="M598 225 V265 M304 265 H929 M304 265 V300 M929 265 V300"/><rect x="60" y="303" width="515" height="102" rx="16" fill="#e2f5ed" stroke="#97cdb6" stroke-width="2"/><text x="86" y="343" class="ex">that researchers published ...</text><text x="86" y="379" class="detail">修饰 report · 定语从句</text><rect x="630" y="303" width="520" height="102" rx="16" fill="#fff1dc" stroke="#e4bd85" stroke-width="2"/><text x="655" y="343" class="ex">that the method may help ...</text><text x="655" y="379" class="detail">suggests 的内容 · 宾语从句</text><text x="60" y="443" class="sub">先找最外层主句，再逐层附加；suggests 与 may 都保留不确定性。</text></svg>