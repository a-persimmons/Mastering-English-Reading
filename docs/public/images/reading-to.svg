<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" role="img" aria-labelledby="title desc"><title id="title">同样的 to：不是同一种语法单位</title><desc id="desc">to 后面的形式受前面动词或搭配的支配。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#20324b}.t{font-size:29px;font-weight:750}.s{font-size:17px;fill:#61738c}.h{font-size:23px;font-weight:700}.v{font-size:24px;font-weight:650}.d{font-size:18px;fill:#526783}.tiny{font-size:16px;fill:#586b82}.stroke{stroke:#799cc2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="468" rx="24" fill="#f8fafd"/><text x="52" y="65" class="t">同样的 to：不是同一种语法单位</text><text x="52" y="99" class="s">to 后面的形式受前面动词或搭配的支配。</text><rect x="50" y="144" width="528" height="246" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><rect x="622" y="144" width="528" height="246" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="80" y="191" class="h">不定式标记</text><text x="80" y="239" class="v">I plan to travel.</text><text x="80" y="285" class="d">to + 动词原形</text><text x="80" y="330" class="d">计划旅行</text><text x="652" y="191" class="h">介词 to</text><text x="652" y="239" class="v">I look forward to traveling.</text><text x="652" y="285" class="d">to + 名词性 -ing 结构</text><text x="652" y="330" class="d">期待旅行</text><text x="55" y="434" class="s">遇到 to，不要急着套“to 后必须跟动词原形”。</text></svg>