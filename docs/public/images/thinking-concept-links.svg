<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-label="从英文形式走向真实意义"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#203453}.title{font-weight:700;font-size:28px}.label{font-weight:650;font-size:21px}.small{font-size:17px;fill:#52657c}.line{fill:none;stroke:#6f9bc9;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:#e7f0ff;stroke:#82a6d2;stroke-width:2}.b{fill:#e1f4ed;stroke:#7dbca1;stroke-width:2}.c{fill:#fff2dc;stroke:#d7b276;stroke-width:2}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="58" class="title">从英文形式走向真实意义</text><rect x="45" y="118" width="300" height="116" rx="17" class="a"/><text x="63" y="160" class="label">英文形式</text><text x="63" y="191" class="small">声音 / 拼写 / 词块</text><path class="line" d="M353 176 L407 176"/><path class="line" d="M398 169 L407 176 L398 183"/><rect x="418" y="118" width="310" height="116" rx="17" class="b"/><text x="436" y="160" class="label">意义与概念</text><text x="436" y="191" class="small">事物 / 关系 / 动作</text><path class="line" d="M735 176 L791 176"/><path class="line" d="M782 169 L791 176 L782 183"/><rect x="800" y="118" width="330" height="116" rx="17" class="c"/><text x="818" y="160" class="label">具体情境</text><text x="818" y="191" class="small">谁在何时做了什么</text><path class="line" d="M959 238 V322 H200 V238"/><text x="430" y="308" class="small">反复练习、主动回忆、跨情境迁移</text></svg>