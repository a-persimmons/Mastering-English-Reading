<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>英语内部语言：用真实生活作为提示，而不是翻译题</title><desc>从每天三个固定时刻开始，每次只需要一两句。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#243652}.h{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#637994}.lab{font-size:23px;font-weight:700}.en{font-size:22px}.cn{font-size:18px;fill:#566b83}.wire{fill:none;stroke:#829dc2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="23" fill="#f7f9fd"/><text x="50" y="63" class="h">英语内部语言：用真实生活作为提示，而不是翻译题</text><text x="50" y="95" class="sub">从每天三个固定时刻开始，每次只需要一两句。</text><rect x="44" y="149" rx="17" width="370" height="#e7f0ff" fill="228" stroke="#ddbd89" stroke-width="2"/><text x="64" y="195" class="lab">开始工作前</text><text x="64" y="254" class="en">I have a meeting at ten.</text><text x="64" y="317" class="cn">安排接下来要做的事</text><rect x="434" y="149" rx="17" width="370" height="#e2f4ec" fill="228" stroke="#ddbd89" stroke-width="2"/><text x="454" y="195" class="lab">做事的时候</text><text x="454" y="254" class="en">I'm looking for my charger.</text><text x="454" y="317" class="cn">描述眼前状态和需求</text><rect x="824" y="149" rx="17" width="370" height="#fff0dc" fill="228" stroke="#ddbd89" stroke-width="2"/><text x="844" y="195" class="lab">一天结束后</text><text x="844" y="254" class="en">I finished my report.</text><text x="844" y="317" class="cn">回顾真实发生的事</text><text x="55" y="429" class="sub">一周后换事件重做，才能验证主动提取，而不只是背熟例句。</text></svg>