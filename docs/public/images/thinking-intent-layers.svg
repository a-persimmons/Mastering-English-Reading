<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 370" role="img" aria-label="字面内容与交际意图，不应混为一谈"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#203453}.title{font-weight:700;font-size:28px}.label{font-weight:650;font-size:21px}.small{font-size:17px;fill:#52657c}.line{fill:none;stroke:#6f9bc9;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:#e7f0ff;stroke:#82a6d2;stroke-width:2}.b{fill:#e1f4ed;stroke:#7dbca1;stroke-width:2}.c{fill:#fff2dc;stroke:#d7b276;stroke-width:2}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="58" class="title">字面内容与交际意图，不应混为一谈</text><rect x="45" y="113" width="346" height="119" rx="17" class="a"/><text x="63" y="155" class="label">明确说了什么？</text><text x="63" y="186" class="small">It's getting cold in here.</text><path class="line" d="M394 174 L419 174"/><path class="line" d="M410 167 L419 174 L410 181"/><rect x="430" y="113" width="338" height="119" rx="17" class="b"/><text x="448" y="155" class="label">可能在暗示什么？</text><text x="448" y="186" class="small">可能希望关窗</text><path class="line" d="M771 174 L800 174"/><path class="line" d="M791 167 L800 174 L791 181"/><rect x="810" y="113" width="325" height="119" rx="17" class="c"/><text x="828" y="155" class="label">能否确定？</text><text x="828" y="186" class="small">必要时进一步确认</text><text x="75" y="304" class="small">语境可以支持合理推断，但不允许把猜测升级成已经确认的事实</text></svg>