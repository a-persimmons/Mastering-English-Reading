<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 405" role="img" aria-label="三个不同的运动关系"><style>text{font-family:Arial,'Noto Sans SC','PingFang SC',sans-serif;fill:#203453}.title{font-weight:700;font-size:28px}.label{font-weight:650;font-size:21px}.small{font-size:17px;fill:#52657c}.line{fill:none;stroke:#6f9bc9;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.a{fill:#e7f0ff;stroke:#82a6d2;stroke-width:2}.b{fill:#e1f4ed;stroke:#7dbca1;stroke-width:2}.c{fill:#fff2dc;stroke:#d7b276;stroke-width:2}</style><rect width="100%" height="100%" rx="24" fill="#f8faff"/><text x="45" y="58" class="title">三个不同的运动关系</text><rect x="45" y="108" width="350" height="250" rx="20" class="a"/><rect x="415" y="108" width="350" height="250" rx="20" class="b"/><rect x="785" y="108" width="350" height="250" rx="20" class="c"/><text x="72" y="147" class="label">across · 横穿</text><text x="442" y="147" class="label">through · 内部穿过</text><text x="812" y="147" class="label">along · 沿着</text><path class="line" d="M78 246 H350"/><path class="line" d="M334 235 L350 246 L334 257"/><rect x="118" y="201" width="195" height="17" rx="8" fill="#95b9dc"/><rect x="535" y="179" width="100" height="127" rx="18" fill="#99d3be"/><path class="line" d="M457 246 H726"/><path class="line" d="M710 235 L726 246 L710 257"/><path d="M845 305 Q939 180 1078 214" stroke="#d7b276" stroke-width="18" fill="none" stroke-linecap="round"/><path class="line" d="M855 318 Q943 210 1082 244"/><text x="72" y="338" class="small">从一侧到另一侧</text><text x="442" y="338" class="small">经过内部空间</text><text x="812" y="338" class="small">沿着某条路线</text></svg>