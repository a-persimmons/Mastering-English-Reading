<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" role="img" aria-labelledby="title desc"><title id="title">双宾语 SVOO 与宾语补足语 SVOC</title><desc id="desc">两个名词性成分接在动词后面，它们之间的关系未必一样。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#20324b}.t{font-size:29px;font-weight:750}.s{font-size:17px;fill:#61738c}.h{font-size:23px;font-weight:700}.v{font-size:24px;font-weight:650}.d{font-size:18px;fill:#526783}.tiny{font-size:16px;fill:#586b82}.stroke{stroke:#799cc2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="468" rx="24" fill="#f8fafd"/><text x="52" y="65" class="t">双宾语 SVOO 与宾语补足语 SVOC</text><text x="52" y="99" class="s">两个名词性成分接在动词后面，它们之间的关系未必一样。</text><rect x="50" y="144" width="528" height="246" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><rect x="622" y="144" width="528" height="246" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="80" y="191" class="h">双宾语：传递</text><text x="80" y="239" class="v">He gave me a book.</text><text x="80" y="285" class="d">me = 接收者；book = 所给之物</text><text x="80" y="330" class="d">问：给谁？给什么？</text><text x="652" y="191" class="h">宾语 + 宾补：说明</text><text x="652" y="239" class="v">They called her a genius.</text><text x="652" y="285" class="d">her = 对象；genius = 对象身份</text><text x="652" y="330" class="d">问：称呼 / 认为她是什么？</text><text x="55" y="434" class="s">判断谁在接收物品，或后一个成分是否描述前一个宾语。</text></svg>