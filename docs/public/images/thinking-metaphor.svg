<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img"><title>从具体经验扩展到抽象意义</title><desc>概念联系有助记忆，但不能用字面推导替代真实用法。</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#243652}.h{font-size:29px;font-weight:750}.sub{font-size:17px;fill:#637994}.lab{font-size:23px;font-weight:700}.en{font-size:22px}.cn{font-size:18px;fill:#566b83}.wire{fill:none;stroke:#829dc2;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" rx="23" fill="#f7f9fd"/><text x="50" y="63" class="h">从具体经验扩展到抽象意义</text><text x="50" y="95" class="sub">概念联系有助记忆，但不能用字面推导替代真实用法。</text><rect x="61" y="150" rx="17" width="510" height="230" fill="#e7f0ff" stroke="#9cbbe2" stroke-width="2"/><text x="88" y="200" class="lab">具体动作</text><text x="88" y="258" class="en">He grasped my hand.</text><text x="88" y="311" class="cn">用手抓住一个东西</text><rect x="628" y="150" rx="17" width="510" height="230" fill="#e2f4ec" stroke="#99cbb4" stroke-width="2"/><text x="654" y="200" class="lab">抽象理解</text><text x="654" y="258" class="en">She grasped the idea.</text><text x="654" y="311" class="cn">“把握”一个想法</text><path class="wire" d="M573 263 H625"/><text x="64" y="427" class="sub">一词的不同用法常形成意义网络，但存在搭配边界和例外。</text></svg>