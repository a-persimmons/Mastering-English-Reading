<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 485" role="img" aria-labelledby="title desc"><title id="title">长名词短语：先找中心词，再挂修饰</title><desc id="desc">The old book about space that I borrowed ... is fascinating.</desc><style>text{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#20324b}.t{font-size:29px;font-weight:750}.s{font-size:17px;fill:#61738c}.h{font-size:23px;font-weight:700}.v{font-size:24px;font-weight:650}.d{font-size:18px;fill:#526783}.tiny{font-size:16px;fill:#586b82}.stroke{stroke:#799cc2;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="485" rx="24" fill="#f8fafd"/><text x="52" y="65" class="t">长名词短语：先找中心词，再挂修饰</text><text x="52" y="99" class="s">The old book about space that I borrowed ... is fascinating.</text><rect x="422" y="167" width="360" height="94" rx="16" fill="#e4f4ee" stroke="#99c8b6" stroke-width="2"/><text x="481" y="226" class="h">the old book</text><path d="M415 208 L320 208" class="stroke"/><path d="M311 201 L320 208 L311 215" class="stroke"/><rect x="54" y="160" width="265" height="111" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><text x="77" y="203" class="h">old</text><text x="77" y="238" class="d">前置修饰：旧的</text><path d="M790 208 L875 208" class="stroke"/><path d="M866 201 L875 208 L866 215" class="stroke"/><rect x="876" y="160" width="270" height="111" rx="16" fill="#fff1da" stroke="#e0c194" stroke-width="2"/><text x="902" y="203" class="h">about space</text><text x="902" y="239" class="d">主题修饰：关于太空</text><rect x="340" y="326" width="536" height="94" rx="16" fill="#e5efff" stroke="#9bbce6" stroke-width="2"/><text x="369" y="367" class="v">that I borrowed from the library</text><text x="370" y="396" class="d">修饰 book 的定语从句</text><path d="M601 261 V322" class="stroke"/><text x="55" y="452" class="s">整块 the old book ... 在主句里仍然只占“主语”一个位置。</text></svg>